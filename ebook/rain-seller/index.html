<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賣雨的人 | 互動式電子書</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink-black: #08090c;
            --gold: #C9A962;
            --cream: #f5f2eb;
            --soft-gray: #6b6b6b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--ink-black);
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
        }
        
        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid var(--soft-gray);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error State */
        .error {
            display: none;
        }
        
        .error h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 20px;
            color: var(--gold);
        }
        
        .error p {
            color: var(--soft-gray);
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 30px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: var(--gold);
            color: var(--ink-black);
        }
        
        /* Success - Redirect to ebook */
        .success {
            display: none;
        }
        
        .success h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
        }
        
        .success p {
            color: var(--soft-gray);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在驗證存取權限...</p>
        </div>
        
        <!-- Error State -->
        <div class="error" id="error">
            <h1>需要購買才能閱讀</h1>
            <p>
                《賣雨的人》互動式電子書<br>
                需要購買後才能存取。
            </p>
            <a href="/selection.html" class="btn">前往選物店購買</a>
        </div>
        
        <!-- Success State -->
        <div class="success" id="success">
            <h1>歡迎回來 ✨</h1>
            <p>正在載入電子書...</p>
        </div>
    </div>
    
    <script>
        // Token 驗證系統
        async function verifyAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError();
                return;
            }
            
            try {
                // 驗證 Token（呼叫 n8n webhook）
                const response = await fetch('https://spacebetween.app.n8n.cloud/webhook/verify-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: token,
                        product: 'rain-seller-ebook'
                    })
                });
                
                const data = await response.json();
                
                if (data.valid) {
                    showSuccess();
                    // 儲存到 localStorage 方便後續存取
                    localStorage.setItem('ebook_token', token);
                    // 重導向到電子書內容
                    setTimeout(() => {
                        window.location.href = 'chapters/index.html';
                    }, 1500);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('驗證失敗:', error);
                
                // 開發模式：如果 webhook 不存在，檢查 localStorage
                const savedToken = localStorage.getItem('ebook_token');
                if (savedToken === token) {
                    showSuccess();
                    setTimeout(() => {
                        window.location.href = 'chapters/index.html';
                    }, 1500);
                } else {
                    showError();
                }
            }
        }
        
        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }
        
        function showSuccess() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }
        
        // 頁面載入時驗證
        verifyAccess();
    </script>
</body>
</html>
